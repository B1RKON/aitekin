name: Supabase Keep-Alive

# Vercel Hobby cron'u kararsiz - GitHub Actions ile her 6 saatte bir
# kesin ping atariz. Boylece Supabase 7 gunluk inactivity pause'unu onler.

on:
  schedule:
    # UTC: 02:00, 08:00, 14:00, 20:00 (her 6 saat) - 4x/gun
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch: # manuel tetikleme icin

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping aitekin keep-alive
        run: |
          echo "Pinging at $(date -u)"
          response=$(curl -sS -w "\n%{http_code}" https://aitekin.com/api/cron/keep-alive)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "Keep-alive failed with status $status"
            exit 1
          fi
          echo "Keep-alive successful"
